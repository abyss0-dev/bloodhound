name: USDT Unit and Replay Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  usdt-unit:
    name: USDT unit and replay tests
    runs-on: takumi-runner
    steps:
      - uses: actions/checkout@v4

      - name: Build the USDT test image
        run: docker build --target build -t bloodhound-usdt-test -f Dockerfile.build .

      - name: Run USDT registry and payload tests
        run: >-
          docker run --rm bloodhound-usdt-test
          cargo test --package bloodhound usdt --target x86_64-unknown-linux-musl
