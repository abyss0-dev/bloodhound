name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        name: Authenticate to Shisho Cloud
        uses: flatt-security/shisho-cloud-action@9b68d33503ebf75d7c285d489b288f96ef3df758 # v1.1.0
        with:
          bot-id: ${{ vars.SHISHO_CICD_SENSOR_BOT_ID }}
          export-token: true
          expires-in-minutes: 60

      - uses: cicd-sensor/cicd-sensor-action@a803a7bc1890f85d3f2feb7c29b74b5c730da6c2 # v0.0.37
        with:
          manager-url: https://manager.cicdsensor.cloud.shisho.dev
          manager-token: ${{ steps.auth.outputs.token }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build binary via Docker
        run: make build-docker

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Require BPF capability
        run: |
          if ! test -r /sys/kernel/btf/vmlinux; then
            echo "BPF-capable kernel BTF is required for USDT E2E"
            exit 1
          fi

      - name: Refresh APT package indexes
        timeout-minutes: 4
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

      - name: Install QEMU & sshpass
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Use-Pty=0 \
            install --yes --no-install-recommends \
            qemu-system-x86 \
            sshpass

      - name: Build rootfs
        working-directory: e2e
        run: bash scripts/build-rootfs.sh

      - name: Boot VM
        working-directory: e2e
        run: |
          bash scripts/boot-vm.sh rootfs.ext4 2222 2048 2 &
          echo "Waiting for VM to boot..."
          for i in $(seq 1 60); do
            sshpass -p root ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=2 \
              -p 2222 root@localhost true 2>/dev/null && break
            sleep 2
          done
          echo "VM is ready"

      - name: Wait for bloodhound daemon
        run: |
          echo "Waiting for bloodhound daemon to load BPF programs..."
          for i in $(seq 1 40); do
            if sshpass -p root ssh \
              -o StrictHostKeyChecking=no \
              -p 2222 root@localhost \
              "journalctl -u bloodhound --no-pager -n 20" 2>/dev/null \
              | grep -q "BPF programs loaded"; then
              echo "Daemon ready (waited ~$((i*3))s)"
              break
            fi
            sleep 3
          done

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Takumi Guard for PyPI
        uses: flatt-security/setup-takumi-guard-pypi@bac24f8a97255d96a277f60de6906154ce0be096 # v1.1.0

      - name: Install test dependencies
        working-directory: e2e
        run: pip install pytest pexpect jsonschema

      - name: Run E2E tests
        working-directory: e2e/tests
        run: |
          python -m pytest -v \
            --ssh-port=2222 \
            --ssh-host=localhost \
            --tb=long \
            .

      - name: Collect VM logs (on failure)
        if: failure()
        working-directory: e2e
        run: |
          echo "=== QEMU log (last 50 lines) ==="
          tail -50 qemu.log 2>/dev/null || true
          echo ""
          echo "=== Bloodhound daemon journal ==="
          sshpass -p root ssh \
            -o StrictHostKeyChecking=no \
            -p 2222 root@localhost \
            "journalctl -u bloodhound --no-pager -n 50" 2>/dev/null || true
          echo ""
          echo "=== NDJSON output (last 20 lines) ==="
          sshpass -p root ssh \
            -o StrictHostKeyChecking=no \
            -p 2222 root@localhost \
            "tail -20 /var/log/bloodhound.ndjson" 2>/dev/null || true

      - name: Shutdown VM
        if: always()
        run: sudo pkill -f "qemu-system-x86_64" || true
